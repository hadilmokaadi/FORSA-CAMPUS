<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORSA Campus - Post / Modify Internship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    
    <style>
        :root {
            --primary-forsa: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        
        body {
            background: var(--bg-gradient);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        /* Modern Modern Logo Icon */
        .logo-icon {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: transform 0.3s ease;
        }
        .navbar-brand:hover .logo-icon {
            transform: rotate(-10deg) scale(1.05);
        }

        /* Glassmorphism/Premium Card Treatment */
        .forsa-premium-card {
            border: none;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06) !important;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Advanced Input Focus States */
        .form-control-forsa {
            border-radius: 14px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            background-color: #f8fafc;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
        }
        .form-control-forsa:focus {
            background-color: #fff;
            border-color: var(--primary-forsa);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
            color: #1e293b;
        }

        /* 🎯 SMART INPUTS GROUP (Fixed: Hna l'astuce l'pro) */
        .input-group-forsa {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-group-forsa i {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.15s ease-in-out, color 0.15s ease-in-out;
        }

        /* Padding kbir fil bdaya bech yji ba3d el icon */
        .input-group-forsa .form-control-forsa {
            padding-left: 45px;
            width: 100%;
        }

        /* 🔥 Ki el user yenzel focused wala yabda yikteb (:not(:placeholder-shown)), el icone tatfa */
        .input-group-forsa .form-control-forsa:focus ~ i,
        .input-group-forsa .form-control-forsa:not(:placeholder-shown) ~ i {
            opacity: 0;
        }

        /* Wa9t el ktiba, el padding yarja3 normal 16px automatically */
        .input-group-forsa .form-control-forsa:focus,
        .input-group-forsa .form-control-forsa:not(:placeholder-shown) {
            padding-left: 16px;
        }

        /* Special override for select element icon behavior */
        .input-group-forsa select.form-control-forsa:focus,
        .input-group-forsa select.form-control-forsa:not(:placeholder-shown) {
            padding-left: 16px;
        }

        /* Buttons Redesign */
        .btn-forsa-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            padding: 12px 28px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
            transition: all 0.25s ease;
        }
        .btn-forsa-primary:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            color: white;
        }
        .btn-forsa-secondary {
            background: #f1f5f9;
            color: #475569;
            font-weight: 600;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 28px;
            transition: all 0.2s ease;
        }
        .btn-forsa-secondary:hover {
            background: #e2e8f0;
            color: #1e293b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-end" href="dashboard-recruteur.html" style="padding: 0; gap: 0; text-decoration: none;">
                
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54" style="display: block; margin-right: 2px;">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3b82f6" />
                            <stop offset="100%" stop-color="#1d4ed8" />
                        </linearGradient>
                    </defs>
                    <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#logoGrad)" />
                    <polygon points="50,30 68,40 68,60 50,70 32,60 32,40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <circle cx="50" cy="50" r="5" fill="#ffffff" />
                </svg>
                
                <span style="font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif; font-size: 1.05rem; color: #0f172a; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; line-height: 1.1; margin-bottom: 4px; margin-left: 4px;">FORSA CAMPUS</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-2 fw-semibold fs-7">
                    <i class="fa-solid fa-briefcase me-1.5"></i> Recruiter Space
                </span>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 850px;">
        <div id="alertMessage" class="alert d-none shadow-sm border-0 animate__animated animate__fadeIn" role="alert"></div>
    </div>

    <div class="container mb-5" style="max-width: 850px;">
        <div class="card forsa-premium-card p-2 p-md-4">
            <div class="card-body">
                <div class="d-flex align-items-center gap-3 mb-2">
                    <div class="p-3 bg-light rounded-4 text-primary">
                        <i class="fa-solid fa-file-pen fs-3"></i>
                    </div>
                    <div>
                        <h3 class="fw-extrabold text-dark mb-0" id="formTitle" style="letter-spacing: -0.5px;">Create New Internship Listing</h3>
                        <p class="text-muted mb-0 small">Provide accurate operational details to match target student profiles.</p>
                    </div>
                </div>
                
                <hr class="opacity-25 my-4">

                <form id="internshipForm" onsubmit="submitForm(event)">
                    
                    <div class="mb-4">
                        <label for="title" class="form-label fw-bold text-secondary small text-uppercase tracking-wider">Position Title *</label>
                        <div class="input-group-forsa">
                            <input type="text" class="form-control form-control-forsa" id="title" placeholder="e.g. Backend Flask Developer" required>
                            <i class="fa-solid fa-keyboard"></i>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="location" class="form-label fw-bold text-secondary small text-uppercase tracking-wider">Location / Office *</label>
                            <div class="input-group-forsa">
                                <input type="text" class="form-control form-control-forsa" id="location" placeholder="e.g. Tunis, Tunisia (or Remote)" required>
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="duration" class="form-label fw-bold text-secondary small text-uppercase tracking-wider">Duration *</label>
                            <div class="input-group-forsa">
                                <input type="text" class="form-control form-control-forsa" id="duration" placeholder="e.g. 3 months" required>
                                <i class="fa-solid fa-calendar-day"></i>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="salary" class="form-label fw-bold text-secondary small text-uppercase tracking-wider">Stipend / Salary Compensation</label>
                            <div class="input-group-forsa">
                                <input type="text" class="form-control form-control-forsa" id="salary" placeholder="e.g. 400 DT / Month (or Unpaid)">
                                <i class="fa-solid fa-wallet"></i>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="status" class="form-label fw-bold text-secondary small text-uppercase tracking-wider">Listing Visibility Status *</label>
                            <div class="input-group-forsa">
                                <select class="form-select form-control-forsa" id="status" required>
                                    <option value="open" selected>🟢 Active & Open (Accepting Applications)</option>
                                    <option value="closed">🔴 Closed / Archived</option>
                                </select>
                                <i class="fa-solid fa-eye"></i>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-bold text-secondary small text-uppercase tracking-wider">Core Missions & Description *</label>
                        <textarea class="form-control form-control-forsa" id="description" rows="5" placeholder="Detail the core tasks, framework architectures, and production expectations..." required></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="requirements" class="form-label fw-bold text-secondary small text-uppercase tracking-wider">Skills & Requirements</label>
                        <textarea class="form-control form-control-forsa" id="requirements" rows="4" placeholder="e.g. Proficiency in Python, Flask, Git version control, MySQL database layout..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-5 pt-2 border-top border-light">
                        <a href="dashboard-recruteur.html" class="btn btn-forsa-secondary px-4 d-flex align-items-center gap-2">
                            <i class="fa-solid fa-xmark"></i> Cancel
                        </a>
                        <button type="submit" id="btn-submit" class="btn btn-forsa-primary px-5 d-flex align-items-center gap-2">
                            Publish Listing <i class="fa-solid fa-paper-plane fs-7"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/internships.js"></script>
    <script>
        // Full alignment framework mapping with parameters from internships.js
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof checkFormMode === "function") {
                checkFormMode();
            }
        });
    </script>
</body>
</html>
