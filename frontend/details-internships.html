<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Stage | FORSA Campus</title>
    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #fcfcfc; font-family: 'Inter', sans-serif; color: #1a1a1a; }
        
        /* Navbar Style */
        .navbar { background: white; border-bottom: 1px solid #eee; }
        
        /* Layout Style */
        .header-card { background: white; border: 1px solid #eee; border-radius: 20px; }
        .company-logo { width: 90px; height: 90px; border-radius: 16px; object-fit: cover; border: 1px solid #f0f0f0; }
        .section-box { background: white; border: 1px solid #eee; border-radius: 20px; padding: 30px; margin-bottom: 20px; }
        
        /* Buttons & Badges */
        .btn-apply { background-color: #1a1a1a; color: white; border-radius: 12px; font-weight: 600; transition: 0.3s; }
        .btn-apply:hover { background-color: #000; transform: translateY(-2px); color: white; }
        .badge { padding: 8px 16px; border-radius: 50px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-premium shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-end" href="feed.html" style="padding: 0; gap: 0; text-decoration: none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54" style="display: block; margin-right: 2px;">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#1d4ed8" />
                    </linearGradient>
                </defs>
                <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#logoGrad)" />
                <polygon points="50,30 68,40 68,60 50,70 32,60 32,40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                <circle cx="50" cy="50" r="5" fill="#ffffff" />
            </svg>
            <span style="font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif; font-size: 1.05rem; color: #0f172a; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; line-height: 1.1; margin-bottom: 4px; margin-left: 4px;">FORSA CAMPUS</span>
        </a>
        
        <a href="profile.html" class="space-badge" style="text-decoration: none;">STUDENT PORTAL</a>
    </div>
</nav>

    <!-- Contenu Principal -->
    <div class="container pb-5" style="max-width: 950px;">
        <div class="header-card p-4 mb-4 shadow-sm">
            <div class="d-flex align-items-center gap-4">
                <img src="https://ui-avatars.com/api/?name=C&background=random" id="det-logo" class="company-logo">
                <div class="flex-grow-1">
                    <h1 class="fw-bold display-6 mb-1" id="det-title">Chargement...</h1>
                    <p class="text-secondary fs-5 mb-0" id="det-company">--</p>
                    <div class="mt-2 d-flex gap-4 text-muted">
                        <span><i class="fa-solid fa-location-dot me-1"></i> <span id="det-location">--</span></span>
                        <span><i class="fa-solid fa-clock me-1"></i> <span id="det-duration">--</span></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="section-box">
                    <h4 class="fw-bold border-start border-4 border-primary ps-3 mb-4">Mission du poste</h4>
                    <p id="det-description" class="text-secondary lh-lg"></p>
                    <hr class="my-4">
                    <h4 class="fw-bold border-start border-4 border-warning ps-3 mb-4">Compétences attendues</h4>
                    <p id="det-requirements" class="text-secondary lh-lg"></p>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="section-box shadow-sm sticky-top" style="top: 20px;">
                    <h5 class="fw-bold mb-4">Détails clés</h5>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Salaire</span>
                        <span class="fw-bold" id="det-salary">--</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-muted">Statut</span>
                        <span id="det-badge" class="badge">--</span>
                    </div>
                    <button id="btn-apply" class="btn btn-apply w-100 py-3" onclick="applyToInternship()">Postuler maintenant</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/internships.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            if (id) loadInternshipDetails(id);
        });

        function applyToInternship() {
            alert("Candidature enregistrée avec succès !");
        }
    </script>
</body>
</html>
