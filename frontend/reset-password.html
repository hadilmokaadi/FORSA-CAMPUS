<!DOCTYPE html>
<html lang="en">

<head>
    <title>Reset Password - Forsa Campus</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="bg-grid"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>


<div class="card">

    <div class="card-header">

        <div class="logo-mark">
            <span>🔒</span>
        </div>

        <h1 class="brand">
            FORSA CAMPUS
        </h1>

        <p class="subtitle">
            Create a new password
        </p>

    </div>


    <form id="resetForm" class="form">


        <div class="field">

            <label for="password">
                New password
            </label>

            <div class="input-wrap">

                <input 
                id="password"
                type="password"
                placeholder="Enter new password"
                required>

            </div>

        </div>


        <p id="msg" class="msg"></p>


        <button class="btn-login" type="submit">
            Reset password
        </button>


    </form>


    <p class="auth-link">
        Remember your password?
        <a href="login.html">
            Login
        </a>
    </p>


</div>


<script src="js/reset-password.js"></script>

</body>

</html>
