<!DOCTYPE html>
<html lang="en">
<head>
    <title>Créer un post - Forsa Campus</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <style>
        .post-page-layout {
            max-width: 640px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .post-page-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 600;
            color: #14142b;
            margin: 0 0 4px;
        }

        .post-page-sub {
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            color: #6b7280;
            margin: 0 0 20px;
        }

        .composer-box {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 1px 3px rgba(20, 20, 43, 0.08);
            padding: 20px 22px;
        }

        .composer-box textarea {
            width: 100%;
            border: none;
            resize: vertical;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: #14142b;
            min-height: 120px;
            box-sizing: border-box;
        }

        .composer-box textarea:focus { outline: none; }

        .composer-preview { margin-top: 10px; max-width: 100%; display: none; }
        .composer-preview img { max-width: 100%; max-height: 320px; border-radius: 10px; display: block; }

        .composer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #eef0f9;
        }

        .composer-photo-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            font-weight: 500;
            color: #4b4f6b;
            background: #f1f2f8;
            border: none;
            border-radius: 9px;
            padding: 8px 14px;
            cursor: pointer;
        }

        .composer-photo-btn:hover { background: #e7e9f5; }

        .btn-publish {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #3b6dff, #1d4ed8);
            border: none;
            border-radius: 10px;
            padding: 9px 22px;
            cursor: pointer;
        }

        .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

        .post-success {
            display: none;
            margin-top: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            color: #1d8a4c;
            background: #eafaf0;
            border-radius: 9px;
            padding: 10px 14px;
        }
    </style>
</head>
<body class="home-body">

<nav class="navbar">
    <div class="nav-inner">
        <a href="feed.html" class="nav-logo">
            <div class="logo-mark small">
                <svg width="18" height="18" viewBox="0 0 28 28" fill="none">
                    <path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <path d="M14 7L21 11V18L14 22L7 18V11L14 7Z" fill="currentColor" opacity="0.15"/>
                    <circle cx="14" cy="14" r="3" fill="currentColor"/>
                </svg>
            </div>
            <span class="nav-brand">FORSA CAMPUS</span>
        </a>

        <div class="nav-links">
            <a href="feed.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none"><path d="M3 12L12 3l9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Accueil</span>
            </a>
            <a href="post.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span>Post</span>
            </a>
            <a href="parcours.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l9 4.5-9 4.5-9-4.5 9-4.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 9.5V15c0 1.5 2.5 3 6 3s6-1.5 6-3V9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span>Mon parcours</span>
            </a>
        </div>

        <div class="nav-user" id="userMenu">
            <div class="avatar-sm" id="navAvatar">?</div>
            <span id="user" class="nav-username"></span>
            <svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="dropdown">
                <a href="profile.html" class="dropdown-item">
                    <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M4 17c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    View profile
                </a>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item danger" onclick="logout()">
                    <svg viewBox="0 0 20 20" fill="none"><path d="M13 15l3-3-3-3M16 12H7M10 5H5a1 1 0 00-1 1v8a1 1 0 001 1h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Sign out
                </button>
            </div>
        </div>
    </div>
</nav>

<main class="post-page-layout">
    <h2 class="post-page-title">Créer un post</h2>
    <p class="post-page-sub">Partagez une actualité, une réussite ou une question avec la communauté.</p>

    <div class="composer-box">
        <textarea id="postContent" placeholder="Partagez une actualité, une réussite, une question…"></textarea>
        <div class="composer-preview" id="composerPreview">
            <img id="composerPreviewImg" src="" alt="">
        </div>
        <div class="composer-footer">
            <label class="composer-photo-btn">
                📷 Photo
                <input type="file" id="postImage" accept="image/*" style="display:none">
            </label>
            <button class="btn-publish" id="publishBtn" onclick="publishPost()">Publier</button>
        </div>
        <div class="post-success" id="postSuccess">✅ Post publié ! Il est maintenant visible dans l'Accueil.</div>
    </div>
</main>

<script src="js/post.js"></script>
</body>
</html>
