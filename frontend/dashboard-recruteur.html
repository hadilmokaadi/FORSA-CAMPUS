<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORSA Campus - Recruiter Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-global: #f8fafc;
            --primary-glow: #6366f1;
            --primary-dark: #4f46e5;
            --text-main: #0f172a;
        }

        body {
            background-color: var(--bg-global);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
        }

        /* Profile Sidebar Bento Box */
        .profile-sidebar-card {
            border: none;
            border-radius: 24px;
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            overflow: hidden;
        }
        .sidebar-bg {
            height: 70px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
        }
        .avatar-container {
            margin-top: -35px;
        }
        .sidebar-avatar {
            width: 72px;
            height: 72px;
            border: 4px solid #ffffff;
            background: #f1f5f9;
            color: #4f46e5;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
        }

        /* Bento Premium Job Card Row Layout */
        .job-offer-card {
            border: 1px solid rgba(226, 232, 240, 0.9);
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .job-offer-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.04);
        }

        /* Dynamic Company Image Wrapper Box */
        .company-logo-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .company-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .company-logo-fallback {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-glow), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Pill Metadata */
        .badge-meta {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 10px;
        }
        
        .badge-status-active {
            background-color: #f0fdf4;
            color: #16a34a;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid #bbf7d0;
            border-radius: 30px;
            padding: 4px 12px;
        }
        
        .badge-status-closed {
            background-color: #fef2f2;
            color: #dc2626;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid #fecaca;
            border-radius: 30px;
            padding: 4px 12px;
        }

        .btn-action-light {
            color: #475569;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            transition: all 0.2s;
        }
        .btn-action-light:hover {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }
    </style>
</head>
<body>

    <!-- Premium Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-end" href="dashboard-recruteur.html" style="padding: 0; gap: 0; text-decoration: none;">
                
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54" style="display: block; margin-right: 2px;">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3b82f6" />
                            <stop offset="100%" stop-color="#1d4ed8" />
                        </linearGradient>
                    </defs>
                    <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#logoGrad)" />
                    <polygon points="50,30 68,40 68,60 50,70 32,60 32,40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <circle cx="50" cy="50" r="5" fill="#ffffff" />
                </svg>
                
                <span style="font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif; font-size: 1.05rem; color: #0f172a; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; line-height: 1.1; margin-bottom: 4px; margin-left: 4px;">FORSA CAMPUS</span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="profile.html" class="btn btn-link text-decoration-none text-secondary fw-semibold small">
                    <i class="fa-solid fa-user-circle fs-5 align-middle me-1"></i> Profile
                </a>
                <button class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold" style="font-size: 0.8rem;" onclick="logout()">
                    <i class="fa-solid fa-arrow-right-from-bracket me-1"></i> Sign Out
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 1140px;">
        <div class="row g-4">
            
            <!-- Sidebar Navigation Left -->
            <div class="col-lg-3 col-md-4">
                <div class="profile-sidebar-card shadow-sm text-center pb-3 mb-4">
                    <div class="sidebar-bg"></div>
                    <div class="avatar-container d-flex justify-content-center">
                        <div class="sidebar-avatar rounded-circle d-flex align-items-center justify-content-center">
                            <i class="fa-solid fa-building fs-3"></i>
                        </div>
                    </div>
                    <h6 class="fw-bold text-dark mt-3 mb-1" id="sidebarCompanyName">TechCorp Tunisia</h6>
                    <p class="text-muted small px-2 mb-3">Premium Recruiter Account</p>
                    <hr class="my-2 mx-3 opacity-10">
                    <div class="d-flex justify-content-between px-3 py-2 small text-secondary fw-medium">
                        <span>Active Offers</span>
                        <strong class="text-dark" id="countActiveOffers">0</strong>
                    </div>
                    <div class="d-flex justify-content-between px-3 py-1 small text-secondary fw-medium">
                        <span>Total Applications</span>
                        <strong class="text-dark">48</strong>
                    </div>
                </div>
            </div>

            <!-- Dashboard Center Listing Content -->
            <div class="col-lg-9 col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                    <div>
                        <h4 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px; font-weight: 800;">Workspace Monitor</h4>
                        <p class="text-secondary small mb-0">Control and edit your active technical internship streams.</p>
                    </div>
                    <a href="form-internship.html" class="btn btn-primary px-4 py-2 fw-bold rounded-pill shadow-sm" style="background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; font-size: 0.85rem;">
                        <i class="fa-solid fa-plus me-1"></i> Post an Internship
                    </a>
                </div>

                <div id="alertMessage" class="alert d-none rounded-3" role="alert"></div>

                <!-- Offers Output Layer Box -->
                <div id="myOffersCardsContainer" class="d-flex flex-column gap-3">
                    <div class="text-center py-5 text-secondary">
                        <div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div> Loading workspace data...
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/internships.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadMyOffers(); 
        });
    </script>
</body>
</html>
