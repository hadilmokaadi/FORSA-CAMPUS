<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil - Forsa Campus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <style>
    body.home-body { background: #f4f5fa; }

    .profile-page-layout {
      max-width: 760px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .profile-card-main {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(20, 20, 43, 0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .profile-banner-main {
      height: 110px;
      background: linear-gradient(135deg, #3b6dff, #8b6dff);
    }

    .profile-head {
      display: flex;
      align-items: flex-end;
      gap: 18px;
      padding: 0 28px;
      margin-top: -42px;
    }

    .profile-avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 4px solid #fff;
      overflow: hidden;
      background: #d8dcf5;
      flex-shrink: 0;
      cursor: pointer;
    }

    .profile-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .avatar-edit-overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 20, 43, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
      color: #fff;
      font-size: 18px;
    }

    .profile-avatar-wrap:hover .avatar-edit-overlay { opacity: 1; }

    .profile-head-info { padding-bottom: 14px; flex: 1; }

    .profile-head-info h2 {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      font-weight: 600;
      color: #14142b;
      margin: 0;
    }

    .headline-row { display: flex; align-items: center; gap: 8px; margin: 3px 0 6px; }

    .headline-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      color: #4b4f6b;
    }

    .headline-text.placeholder { color: #b0b3c6; font-style: italic; }

    .headline-edit-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9296ab;
      font-size: 12px;
      padding: 2px;
    }

    .headline-edit-btn:hover { color: #3b6dff; }

    .headline-input-row { display: flex; gap: 6px; align-items: center; margin: 3px 0 6px; }

    .headline-input-row input {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      border: 1px solid #d8dcf5;
      border-radius: 8px;
      padding: 6px 10px;
      flex: 1;
      max-width: 320px;
    }

    .headline-input-row button {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .headline-input-row .save-btn { background: #3b6dff; color: #fff; }
    .headline-input-row .cancel-btn { background: #f1f2f8; color: #4b4f6b; }

    .role-badge {
      display: inline-block;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #3b6dff, #1d4ed8);
      border-radius: 20px;
      padding: 3px 12px;
    }

    .profile-body { padding: 24px 28px 28px; }

    .email-line {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: #8b8fa3;
      margin: 0 0 16px;
    }

    /* Enterprise form (unchanged style) */
    .field-row { margin-bottom: 16px; }

    .field-row label {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #4b4f6b;
      margin-bottom: 6px;
    }

    .field-row input,
    .field-row textarea {
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      border: 1px solid #e0e2f0;
      border-radius: 9px;
      padding: 10px 12px;
      box-sizing: border-box;
      color: #14142b;
      background: #fafbff;
    }

    .field-row input:focus,
    .field-row textarea:focus { outline: none; border-color: #3b6dff; background: #fff; }

    .field-row textarea { resize: vertical; min-height: 80px; }

    .field-row input[type="file"] { background: #fff; padding: 8px 10px; cursor: pointer; }

    .btn-primary {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #3b6dff, #1d4ed8);
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      cursor: pointer;
    }

    .btn-primary:hover { opacity: 0.92; }

    /* ── Parcours (read-only) / CV ───────────── */
    .extra-section {
      margin-top: 8px;
      padding-top: 22px;
      border-top: 1px solid #eef0f9;
    }

    .extra-section h3 {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      font-weight: 600;
      color: #14142b;
      margin: 0 0 4px;
    }

    .extra-section .section-sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: #6b7280;
      margin: 0 0 16px;
    }

    .parcours-empty {
      text-align: center;
      padding: 28px 16px;
      color: #8b8fa3;
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
    }

    .timeline { list-style: none; padding: 0; margin: 0; }

    .timeline-item {
      position: relative;
      padding: 4px 0 18px 24px;
      border-left: 2px solid #e7e9f5;
    }

    .timeline-item:last-child { border-left: 2px solid transparent; padding-bottom: 0; }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 4px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #3b6dff;
      border: 2px solid #fff;
      box-shadow: 0 0 0 2px #e7e9f5;
    }

    .timeline-card {
      background: #fafbff;
      border: 1px solid #eef0f9;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .timeline-diplome { font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14.5px; color: #14142b; }
    .timeline-etab { font-family: 'DM Sans', sans-serif; font-size: 13px; color: #4b4f6b; margin-top: 2px; }
    .timeline-years { font-family: 'DM Sans', sans-serif; font-size: 12px; color: #8b8fa3; margin-top: 3px; }

    /* CV box */
    .cv-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafbff;
      border: 1px solid #eef0f9;
      border-radius: 10px;
      padding: 14px 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .cv-info { font-family: 'DM Sans', sans-serif; font-size: 13.5px; color: #14142b; }
    .cv-info span { display: block; font-size: 12px; color: #8b8fa3; margin-top: 2px; }

    .btn-cv-link {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #3b6dff;
      background: #eef2ff;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      text-decoration: none;
    }

    .cv-upload-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #4b4f6b;
      background: #f1f2f8;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
    }

    .link-to-parcours {
      display: inline-block;
      margin-top: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #3b6dff;
      text-decoration: none;
    }
  </style>
</head>

<body class="home-body">

<nav class="navbar">
    <div class="nav-inner">
        <a href="feed.html" class="nav-logo">
            <div class="logo-mark small">
                <svg width="18" height="18" viewBox="0 0 28 28" fill="none">
                    <path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <path d="M14 7L21 11V18L14 22L7 18V11L14 7Z" fill="currentColor" opacity="0.15"/>
                    <circle cx="14" cy="14" r="3" fill="currentColor"/>
                </svg>
            </div>
            <span class="nav-brand">FORSA CAMPUS</span>
        </a>

        <div class="nav-links">
    <a href="feed.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 12L12 3l9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Accueil</span>
    </a>

    <a href="search-internships.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Stages</span>
    </a>

    <a href="post.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Post</span>
    </a>

    <a href="parcours.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l9 4.5-9 4.5-9-4.5 9-4.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 9.5V15c0 1.5 2.5 3 6 3s6-1.5 6-3V9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Mon parcours</span>
    </a>
</div>

        <div class="nav-user" id="userMenu">
            <div class="avatar-sm" id="navAvatar">?</div>
            <span id="user" class="nav-username"></span>
            <svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="dropdown">
                <a href="profile.html" class="dropdown-item">
                    <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M4 17c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    View profile
                </a>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item danger" onclick="logout()">
                    <svg viewBox="0 0 20 20" fill="none"><path d="M13 15l3-3-3-3M16 12H7M10 5H5a1 1 0 00-1 1v8a1 1 0 001 1h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Sign out
                </button>
            </div>
        </div>
    </div>
</nav>

<main class="profile-page-layout">

    <div class="profile-card-main">
        <div class="profile-banner-main"></div>
        <div class="profile-head">
            <label class="profile-avatar-wrap" id="avatarWrap">
                <img id="profileAvatar" />
                <div class="avatar-edit-overlay">✎</div>
                <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="uploadPhoto()">
            </label>
            <div class="profile-head-info">
                <h2 id="userName">Chargement...</h2>
                <p class="email-line" id="userEmail" style="margin-top:4px;"></p>
                <span class="role-badge" id="userRole"></span>
            </div>
        </div>

        <div class="profile-body">

            <!-- ── ENTERPRISE FORM (companies only) ───────────── -->
            <form id="profileForm" style="display:none;">
                <div id="dynamicFields"></div>
                <div class="actions">
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </form>

            <!-- ── PARCOURS (read-only, students only) ───────────── -->
            <div class="extra-section" id="parcoursSection" style="display:none;">
                <h3>Mon parcours universitaire</h3>
                <p class="section-sub">Vos diplômes et formations.</p>
                <div id="parcoursList"></div>
                <a href="parcours.html" class="link-to-parcours">Gérer mon parcours →</a>
            </div>

            <!-- ── CV (view only — manage from Mon parcours) ───────────── -->
            <div class="extra-section" id="cvSection" style="display:none;">
                <h3>Mon CV</h3>
                <p class="section-sub">Le CV joint sera proposé automatiquement lors de vos candidatures.</p>
                <div class="cv-box">
                    <div class="cv-info" id="cvInfo">Aucun CV ajouté pour l'instant.</div>
                    <a id="cvViewLink" class="btn-cv-link" style="display:none;" target="_blank">Voir le CV</a>
                </div>
                <a href="parcours.html" class="link-to-parcours">Gérer mon CV →</a>
            </div>
        </div>
    </div>

</main>

<script src="js/profile.js"></script>
<script>
    const userMenu = document.getElementById("userMenu");
    if (userMenu) {
        userMenu.addEventListener("click", function (e) {
            if (e.target.closest(".dropdown-item")) {
                userMenu.classList.remove("open");
                return;
            }
            e.stopPropagation();
            userMenu.classList.toggle("open");
        });
        document.addEventListener("click", function () {
            userMenu.classList.remove("open");
        });
    }

    function logout() {
        fetch("http://127.0.0.1:5000/logout", { credentials: "include" })
            .finally(() => {
                localStorage.removeItem("user");
                window.location.href = "login.html";
            });
    }

    (function () {
        const u = JSON.parse(localStorage.getItem("user") || "null");
        if (!u) return;
        const nom = (u.nom || "").trim();
        const prenom = (u.prenom || "").trim();
        const fullName = (nom + " " + prenom).trim() || u.name || u.email || "User";
        const initial = (nom[0] || prenom[0] || fullName[0] || "U").toUpperCase();
        document.getElementById("user").innerText = fullName;
        document.getElementById("navAvatar").innerText = initial;
    })();
</script>
</body>
</html>
