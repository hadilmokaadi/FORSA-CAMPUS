<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - Forsa Campus</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="card">
    <div class="card-header">
        <div class="logo-mark">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                <path d="M14 7L21 11V18L14 22L7 18V11L14 7Z" fill="currentColor" opacity="0.15"/>
                <circle cx="14" cy="14" r="3" fill="currentColor"/>
            </svg>
        </div>
        <h1 class="brand">FORSA CAMPUS</h1>
        <p class="subtitle">Create your account</p>
    </div>

    <form id="registerForm" class="form" novalidate>

        <div class="field-row">
            <div class="field">
                <label for="nom">Last name</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/>
                        <path d="M4 17c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                    <input id="nom" type="text" placeholder="Dupont" autocomplete="family-name" required>
                </div>
            </div>

            <div class="field">
                <label for="prenom">First name</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/>
                        <path d="M4 17c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                    <input id="prenom" type="text" placeholder="Marie" autocomplete="given-name" required>
                </div>
            </div>
        </div>

        <div class="field">
            <label for="email">Email address</label>
            <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 20 20" fill="none">
                    <path d="M3 5h14l-7 7-7-7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                    <rect x="3" y="5" width="14" height="10" rx="1" stroke="currentColor" stroke-width="1.4"/>
                </svg>
                <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 20 20" fill="none">
                    <rect x="5" y="9" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M7 9V7a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
                <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" required>
                <button type="button" class="toggle-pw" tabindex="-1" aria-label="Show password">
                    <svg viewBox="0 0 20 20" fill="none">
                        <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.4"/>
                        <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="field">
            <label for="role">I am a…</label>
            <div class="input-wrap select-wrap">
                <svg class="input-icon" viewBox="0 0 20 20" fill="none">
                    <rect x="3" y="4" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M7 4V3M13 4V3M3 8h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
                <select id="role" required>
                    <option value="etudiant">Étudiant</option>
                    <option value="entreprise">Entreprise</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 20 20" fill="none">
                    <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <p id="msg" class="msg" role="alert"></p>

        <button type="submit" class="btn-login">
            <span class="btn-text">Create account</span>
            <span class="btn-loader" hidden>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" fill="none" stroke-dasharray="40" stroke-dashoffset="15"/></svg>
            </span>
        </button>
    </form>

    <p class="register-link">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<script src="js/register.js"></script>
<script>
    document.querySelector('.toggle-pw').addEventListener('click', function () {
        const pw = document.getElementById('password');
        pw.type = pw.type === 'password' ? 'text' : 'password';
        this.classList.toggle('active');
    });
</script>
</body>
</html>
