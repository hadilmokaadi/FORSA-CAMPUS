<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fil d'actualité - Forsa Campus</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <style>
        .dash-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px;
            align-items: start;
        }

        @media (max-width: 860px) {
            .dash-layout { grid-template-columns: 1fr; }
        }

        .feed-col { display: flex; flex-direction: column; gap: 16px; }

        .composer-box {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 1px 3px rgba(20, 20, 43, 0.08);
            padding: 18px 20px;
        }

        .composer-box textarea {
            width: 100%;
            border: none;
            resize: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 14.5px;
            color: #14142b;
            min-height: 60px;
            box-sizing: border-box;
        }

        .composer-box textarea:focus { outline: none; }

        .composer-preview {
            margin-top: 10px;
            max-width: 100%;
            border-radius: 10px;
            display: none;
        }

        .composer-preview img { max-width: 100%; max-height: 260px; border-radius: 10px; display: block; }

        .composer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eef0f9;
        }

        .composer-photo-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            font-weight: 500;
            color: #4b4f6b;
            background: #f1f2f8;
            border: none;
            border-radius: 9px;
            padding: 8px 14px;
            cursor: pointer;
        }

        .composer-photo-btn:hover { background: #e7e9f5; }

        .btn-publish {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #3b6dff, #1d4ed8);
            border: none;
            border-radius: 10px;
            padding: 9px 20px;
            cursor: pointer;
        }

        .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

        .post-box {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 1px 3px rgba(20, 20, 43, 0.08);
            padding: 18px 20px;
        }

        .post-head { display: flex; align-items: center; gap: 10px; }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b6dff, #8b6dff);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 15px;
            flex-shrink: 0;
        }

        .post-author {
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 14.5px;
            color: #14142b;
        }

        .post-meta {
            font-family: 'DM Sans', sans-serif;
            font-size: 12.5px;
            color: #8b8fa3;
        }

        .post-content {
            font-family: 'DM Sans', sans-serif;
            font-size: 14.5px;
            color: #2c2e44;
            line-height: 1.55;
            margin: 12px 0;
            white-space: pre-wrap;
        }

        .post-image { width: 100%; border-radius: 12px; margin-bottom: 8px; }

        .post-actions {
            display: flex;
            gap: 18px;
            padding-top: 10px;
            border-top: 1px solid #eef0f9;
        }

        .post-action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            color: #6b6f88;
        }

        .post-action-btn:hover { color: #3b6dff; }
        .post-action-btn.liked { color: #3b6dff; font-weight: 600; }

        .comments-section { margin-top: 14px; display: none; }
        .comments-section.open { display: block; }

        .comment-item {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .comment-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #d8dcf5;
            color: #3b3f63;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
        }

        .comment-bubble {
            background: #f5f6fb;
            border-radius: 10px;
            padding: 8px 12px;
            flex: 1;
        }

        .comment-author {
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: #14142b;
        }

        .comment-text {
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            color: #3a3d56;
        }

        .comment-input-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .comment-input-row input {
            flex: 1;
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            border: 1px solid #e0e2f0;
            border-radius: 18px;
            padding: 8px 14px;
        }

        .comment-input-row input:focus { outline: none; border-color: #3b6dff; }

        .comment-send {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #3b6dff;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 6px;
        }

        .feed-empty {
            text-align: center;
            padding: 48px 20px;
            color: #8b8fa3;
            font-family: 'DM Sans', sans-serif;
            background: #fff;
            border-radius: 14px;
        }

        /* Reactions */
        .reaction-wrapper { position: relative; }

        .reaction-trigger.active { color: #3b6dff; font-weight: 600; }

        .reaction-picker {
            display: none;
            position: absolute;
            bottom: 36px;
            left: 0;
            background: #fff;
            border-radius: 30px;
            box-shadow: 0 4px 16px rgba(20,20,43,0.16);
            padding: 6px 8px;
            gap: 4px;
            z-index: 20;
        }

        .reaction-picker.open { display: flex; }

        .reaction-picker button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            transition: transform 0.1s;
        }

        .reaction-picker button:hover { transform: scale(1.25); background: #f1f2f8; }

        /* Comment owner actions */
        .comment-owner-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .comment-owner-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 11.5px;
            color: #8b8fa3;
            padding: 0;
        }

        .comment-owner-actions button:hover { color: #3b6dff; text-decoration: underline; }
        .comment-owner-actions button.del:hover { color: #e0405a; }

        .comment-edit-row { display: flex; gap: 6px; margin-top: 4px; }

        .comment-edit-row input {
            flex: 1;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            border: 1px solid #d8dcf5;
            border-radius: 14px;
            padding: 6px 12px;
        }

        .comment-edit-row button {
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
        }

        .comment-edit-row .save-btn { background: #3b6dff; color: #fff; }
        .comment-edit-row .cancel-btn { background: #f1f2f8; color: #4b4f6b; }

        /* Post owner actions */
        .post-owner-actions { display: flex; gap: 4px; align-self: flex-start; }

        .post-edit-row { margin: 10px 0; }

        .post-edit-row textarea {
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            font-size: 14.5px;
            border: 1px solid #d8dcf5;
            border-radius: 10px;
            padding: 10px 12px;
            min-height: 70px;
            box-sizing: border-box;
            resize: vertical;
        }

        .post-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-cancel-post, .btn-save-post {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 7px 14px;
            cursor: pointer;
        }

        .btn-cancel-post { background: #f1f2f8; color: #4b4f6b; }
        .btn-save-post { background: #3b6dff; color: #fff; }
    </style>
</head>
